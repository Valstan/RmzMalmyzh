# nginx-vhost для рмз.вмалмыже.рф (Бокс Сабантуя, 81.177.141.140) — статика.
# Ставится/обновляется деплой-воркфлоу (deploy-prod.yml) идемпотентно.
#
# G150: внешние 80/443 терминирует прокси Джино и форвардит ВСЁ на внутренний :80
# с заголовком X-Forwarded-Proto. Поэтому: слушаем только :80, редирект на https —
# строго по $http_x_forwarded_proto (по $scheme будет петля), а сам TLS-сертификат
# выпускается в панели Джино (Домены → рмз.вмалмыже.рф → SSL → Установить).

server {
    listen 80;
    listen [::]:80;
    server_name xn--g1ajl.xn--80adkdyec4j.xn--p1ai;

    root /home/valstan/rmz/current;
    index index.html;
    charset utf-8;

    # ACME-челлендж (выпуск LE через панель Джино) — всегда без редиректа.
    # Важно: server-level if-return сработал бы ДО выбора location и ломал выпуск,
    # поэтому https-редирект живёт внутри location / ниже.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # security-заголовки (их нет на rmz43.ru — см. аудит §2.5)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ {
        expires 30d;
    }

    location / {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
