# nginx-vhost для рмз.вмалмыже.рф (Бокс Сабантуя, 81.177.141.140) — стадия 2:
# reverse-proxy на Node standalone :3002 (третий жилец рядом с :3000/:3001).
# Ставится/обновляется деплой-воркфлоу (deploy-prod.yml) идемпотентно.
#
# G150: внешние 80/443 терминирует прокси Джино и форвардит ВСЁ на внутренний :80
# с заголовком X-Forwarded-Proto. Поэтому: слушаем только :80, редирект на https —
# строго по $http_x_forwarded_proto (по $scheme будет петля), а сам TLS-сертификат
# выпускается в панели Джино (Домены → рмз.вмалмыже.рф → SSL → Установить).

server {
    listen 80;
    listen [::]:80;
    server_name xn--g1ajl.xn--80adkdyec4j.xn--p1ai;

    charset utf-8;

    # ACME-челлендж (выпуск LE через панель Джино) — всегда без редиректа и без прокси.
    location ^~ /.well-known/acme-challenge/ {
        root /home/valstan/rmz/acme;
        try_files $uri =404;
    }

    # security-заголовки (их нет на rmz43.ru — см. аудит §2.5)
    add_header X-Content-Type-Options nosniff always;
    # HSTS: TLS терминирует прокси Джино, но наружу сайт строго https (аудит §2.5)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # Иммутабельные ассеты Next — длинный кэш снимает нагрузку с единственного vCPU
    # (урок Sabantuy: горло бокса — CPU, не RAM).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Харвест-картинки контента: контент-стабильные, 30 дней.
    location /images/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        expires 30d;
    }

    location / {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 25m; # загрузки в админку (Media)
    }
}
