# nginx-vhost для рмз.вмалмыже.рф (Бокс 1) — статика из out/
# Установка (проектная сессия / owner):
#   1. rsync out/ -> /var/www/rmz/
#   2. ln -s этого файла в /etc/nginx/sites-enabled/, nginx -t && systemctl reload nginx
#   3. certbot --nginx -d xn--g1ajl.xn--80adkdyec4j.xn--p1ai  (после A-записи)

server {
    listen 80;
    listen [::]:80;
    server_name xn--g1ajl.xn--80adkdyec4j.xn--p1ai;

    root /var/www/rmz;
    index index.html;
    charset utf-8;

    # security-заголовки (их нет на rmz43.ru — см. аудит §2.5)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
