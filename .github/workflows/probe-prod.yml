name: Probe prod (manual)

# Диагностика с бокса (с dev-машин HTTP-пробы глохнут — G147):
# внешняя петля бокс -> прокси Джино -> бокс, ACME-путь, TLS-CN.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_rmz
          chmod 600 ~/.ssh/id_ed25519_rmz
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host rmz
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User valstan
            IdentityFile ~/.ssh/id_ed25519_rmz
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Probe from box (external loop)
        run: |
          ssh rmz 'bash -s' <<'REMOTE'
          D=xn--g1ajl.xn--80adkdyec4j.xn--p1ai
          K=xn--80aaa0andu6a3j.xn--80adkdyec4j.xn--p1ai
          echo "== vhost на боксе (локации) =="
          sudo grep -n "location\|return 301\|server_name" /etc/nginx/conf.d/rmz.conf || true
          echo "== ЛОКАЛЬНО (мимо прокси): ACME-путь без XFP =="
          curl -s -o /dev/null -w 'status %{http_code}\n' --max-time 10 -H "Host: $D" "http://127.0.0.1/.well-known/acme-challenge/probe123"
          echo "== ЛОКАЛЬНО: / без XFP =="
          curl -s -o /dev/null -w 'status %{http_code} -> %{redirect_url}\n' --max-time 10 -H "Host: $D" "http://127.0.0.1/"
          echo "== ВНЕШНЯЯ ПЕТЛЯ: ACME-путь (куда 301?) =="
          curl -s -o /dev/null -w 'status %{http_code} -> %{redirect_url}\n' --max-time 20 "http://$D/.well-known/acme-challenge/probe123" || echo "acme FAIL"
          echo "== ВНЕШНЯЯ ПЕТЛЯ: https / (куда 302?) =="
          curl -sk -o /dev/null -w 'status %{http_code} -> %{redirect_url}\n' --max-time 20 "https://$D/" || echo "https FAIL"
          echo "== СРАВНЕНИЕ казанская: http ACME =="
          curl -s -o /dev/null -w 'status %{http_code} -> %{redirect_url}\n' --max-time 20 "http://$K/.well-known/acme-challenge/probe123" || echo "kaz acme FAIL"
          echo "== СРАВНЕНИЕ казанская: https CN =="
          echo | timeout 20 openssl s_client -connect "$K:443" -servername "$K" 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || echo "kaz s_client FAIL"
          echo "== рмз https CN сейчас =="
          echo | timeout 20 openssl s_client -connect "$D:443" -servername "$D" 2>/dev/null | openssl x509 -noout -subject -dates 2>/dev/null || echo "s_client FAIL"
          REMOTE

      # Также с раннера (внешняя точка без DPI)
      - name: Probe from runner
        run: |
          D=xn--g1ajl.xn--80adkdyec4j.xn--p1ai
          echo "== http / с раннера =="
          curl -s -o /dev/null -w 'status %{http_code}, redirect: %{redirect_url}\n' --max-time 20 "http://$D/" || echo "http FAIL"
          echo "== http ACME-путь с раннера =="
          curl -s -o /dev/null -w 'status %{http_code}\n' --max-time 20 "http://$D/.well-known/acme-challenge/probe123" || echo "acme FAIL"
          echo "== https CN с раннера =="
          echo | timeout 20 openssl s_client -connect "$D:443" -servername "$D" 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "s_client FAIL"
