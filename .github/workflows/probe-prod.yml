name: Probe prod (manual)

# Диагностика с бокса (с dev-машин HTTP-пробы глохнут — G147):
# внешняя петля бокс -> прокси хостера -> бокс, ACME-путь, TLS-CN.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_rmz
          chmod 600 ~/.ssh/id_ed25519_rmz
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host rmz
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User valstan
            IdentityFile ~/.ssh/id_ed25519_rmz
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Probe from box (external loop)
        run: |
          ssh rmz 'bash -s' <<'REMOTE'
          D=xn--g1ajl.xn--80adkdyec4j.xn--p1ai
          K=xn--80aaa0andu6a3j.xn--80adkdyec4j.xn--p1ai
          echo "== vhost на боксе (локации) =="
          sudo grep -n "location\|return 301\|server_name" /etc/nginx/conf.d/rmz.conf || true
          echo "== ЛОКАЛЬНО (мимо прокси): ACME-путь без XFP =="
          curl -s -o /dev/null -w 'status %{http_code}\n' --max-time 10 -H "Host: $D" "http://127.0.0.1/.well-known/acme-challenge/probe123"
          echo "== ЛОКАЛЬНО: / без XFP =="
          curl -s -o /dev/null -w 'status %{http_code} -> %{redirect_url}\n' --max-time 10 -H "Host: $D" "http://127.0.0.1/"
          echo "== ВНЕШНЯЯ ПЕТЛЯ: ACME-путь (куда 301?) =="
          curl -s -o /dev/null -w 'status %{http_code} -> %{redirect_url}\n' --max-time 20 "http://$D/.well-known/acme-challenge/probe123" || echo "acme FAIL"
          echo "== ВНЕШНЯЯ ПЕТЛЯ: https / (куда 302?) =="
          curl -sk -o /dev/null -w 'status %{http_code} -> %{redirect_url}\n' --max-time 20 "https://$D/" || echo "https FAIL"
          echo "== СРАВНЕНИЕ казанская: http ACME =="
          curl -s -o /dev/null -w 'status %{http_code} -> %{redirect_url}\n' --max-time 20 "http://$K/.well-known/acme-challenge/probe123" || echo "kaz acme FAIL"
          echo "== СРАВНЕНИЕ казанская: https CN =="
          echo | timeout 20 openssl s_client -connect "$K:443" -servername "$K" 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || echo "kaz s_client FAIL"
          echo "== рмз https CN сейчас =="
          echo | timeout 20 openssl s_client -connect "$D:443" -servername "$D" 2>/dev/null | openssl x509 -noout -subject -dates 2>/dev/null || echo "s_client FAIL"
          REMOTE

      - name: Mail diagnostics (journal + env)
        run: |
          ssh rmz 'sudo bash -s' <<'REMOTE'
          echo "== SMTP-строки в /etc/rmz/rmz.env (значения скрыты) =="
          grep -E '^(SMTP_|SMARTCAPTCHA_)' /etc/rmz/rmz.env | sed 's/=.*/=***/' || echo "нет строк"
          echo "== env процесса rmz (дошли ли переменные до Node) =="
          MAINPID=$(systemctl show -p MainPID --value rmz)
          sudo cat "/proc/$MAINPID/environ" 2>/dev/null | tr '\0' '\n' | grep -E '^(SMTP_|SMARTCAPTCHA_)' | sed 's/=.*/=***/' || echo "нет переменных в процессе"
          echo "== журнал rmz: почта/заявки/анкеты (последние 100 строк) =="
          journalctl -u rmz -n 400 --no-pager -o cat | grep -iE "smtp|email|mail|zayavka|rezyume|nodemailer|535|EAUTH|ECONN" | tail -100 || echo "совпадений нет"
          echo "== последние 30 строк журнала как есть =="
          journalctl -u rmz -n 30 --no-pager -o cat
          REMOTE

      # Падение рендера на проде видно посетителю только как «Application error»
      # с digest'ом: сам текст ошибки Next в продакшене не показывает намеренно.
      # Стек лежит в журнале сервиса — вытаскиваем его отдельно, отфильтровав
      # шум «Failed to find Server Action» (это не поломка, а вкладка, открытая
      # до деплоя: клиент зовёт экшен предыдущей сборки).
      - name: Журнал — свежие ошибки рендера
        run: |
          ssh rmz 'sudo bash -s' <<'REMOTE'
          echo "== ошибки в журнале (последние 400 строк, без шума server-action) =="
          journalctl -u rmz -n 400 --no-pager -o cat \
            | grep -viE 'failed to find server action|nextjs\.org/docs/messages/failed-to-find' \
            | grep -iE 'error|exception|digest|unhandled|ECONNREFUSED|permission denied|at [A-Za-z_$][A-Za-z0-9_$.]* \(' \
            | tail -60 || echo "ошибок нет"
          echo "== сколько раз встретился шум server-action (для контекста) =="
          journalctl -u rmz -n 400 --no-pager -o cat | grep -ciE 'failed to find server action' || true
          REMOTE

      # Профилактика G234 (письмо brain 2026-08-08): гонка keep-alive между
      # idle-таймаутом пула nginx и `server.keepAliveTimeout` Node даёт 502 на
      # случайной позиции серии POST при пустых логах приложения. Таймаут задаётся
      # В КОДЕ/окружении, а не в конфиге nginx, поэтому обычный аудит инфры его не
      # видит — и наоборот: если у nginx нет upstream-пула с `keepalive`, гонки нет
      # вовсе. Замеряем обе половины, ничего не меняя.
      - name: Keep-alive и SIGTERM — замер (read-only)
        run: |
          ssh rmz 'sudo bash -s' <<'REMOTE'
          echo "== есть ли у nginx upstream-пул с keepalive (без него гонки G234 нет) =="
          grep -rn "upstream\|keepalive\|proxy_http_version\|proxy_set_header Connection" \
            /etc/nginx/nginx.conf /etc/nginx/conf.d/ 2>/dev/null || echo "совпадений нет"
          echo "== keepalive_timeout самого nginx (клиентская сторона) =="
          nginx -T 2>/dev/null | grep -E "^\s*keepalive(_timeout|_requests)?\s" | sort -u || echo "не задан явно"
          echo "== KEEP_ALIVE_TIMEOUT в окружении процесса rmz (Next standalone читает его) =="
          MAINPID=$(systemctl show -p MainPID --value rmz)
          tr '\0' '\n' < "/proc/$MAINPID/environ" 2>/dev/null | grep -E '^(KEEP_ALIVE_TIMEOUT|NODE_OPTIONS|NEXT_MANUAL_SIG_HANDLE)=' \
            || echo "KEEP_ALIVE_TIMEOUT не задан → Node держит дефолт 5 секунд"
          echo "== фактические таймауты живого сервера, снятые с процесса =="
          echo "(если keepAliveTimeout=5000 при пуле nginx с keepalive — это красный G234)"
          echo "== KillSignal/TimeoutStopSec юнита: успевает ли дренаж =="
          systemctl show rmz -p KillSignal -p TimeoutStopUSec -p KillMode -p Restart
          REMOTE

      # Также с раннера (внешняя точка без DPI)
      - name: Probe from runner
        run: |
          D=xn--g1ajl.xn--80adkdyec4j.xn--p1ai
          echo "== http / с раннера =="
          curl -s -o /dev/null -w 'status %{http_code}, redirect: %{redirect_url}\n' --max-time 20 "http://$D/" || echo "http FAIL"
          echo "== http ACME-путь с раннера =="
          curl -s -o /dev/null -w 'status %{http_code}\n' --max-time 20 "http://$D/.well-known/acme-challenge/probe123" || echo "acme FAIL"
          echo "== https CN с раннера =="
          echo | timeout 20 openssl s_client -connect "$D:443" -servername "$D" 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "s_client FAIL"
