# Разовый воркфлоу: положить секреты форм (SmartCaptcha + SMTP) в прод-env, минуя чат/репо.
# Харвест apply-smtp-secrets.yml Сабантуя (#008: секреты только через GitHub Secrets).
#
# Секреты (Settings → Secrets and variables → Actions):
#   secrets.SMARTCAPTCHA_SERVER_KEY — серверный ключ капчи rmz-malmyzh (Яндекс Облако,
#     каталог default облака sabantuymalm). Обязателен.
#   secrets.SMTP_PASS — пароль приложения Яндекса для valstan@valstan.ru
#     (id.yandex.ru → Безопасность → Пароли приложений → «Почта»). Опционален:
#     нет секрета → SMTP-блок не пишется, заявки остаются только в /admin.
#
# Клиентский ключ капчи — НЕ здесь: он публичный и бейкается в сборку деплоем
# (vars.NEXT_PUBLIC_SMARTCAPTCHA_KEY в deploy-prod.yml).
#
# SMTP-значения — как у Сабантуя (docs/ops/smtp-setup.md там же): ящик владельца
# valstan@valstan.ru на Яндекс-почте, потому smtp.yandex.ru:465 SSL;
# SMTP_FROM_ADDRESS обязан совпадать с SMTP_USER, иначе relay отклонит.
# Получатель дубля заявок захардкожен в коде (SITE.emails.sales).
#
# Идемпотентно: прежние строки блока удаляются и переписываются — повторный
# запуск пересинхронит. GitHub маскирует значения секретов в логах.
on:
  workflow_dispatch:

concurrency:
  group: rmz-prod-ssh
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -e
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_PORT" ]; then
            echo "::error::Заданы не все: secrets.SSH_PRIVATE_KEY / vars.DEPLOY_SSH_HOST / vars.DEPLOY_SSH_PORT"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_rmz
          chmod 600 ~/.ssh/id_ed25519_rmz
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host rmz
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User valstan
            IdentityFile ~/.ssh/id_ed25519_rmz
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Write form secrets on prod + restart
        env:
          SMARTCAPTCHA_SERVER_KEY: ${{ secrets.SMARTCAPTCHA_SERVER_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -e
          if [ -z "$SMARTCAPTCHA_SERVER_KEY" ]; then
            echo "::error::Добавь secrets.SMARTCAPTCHA_SERVER_KEY (серверный ключ капчи rmz-malmyzh)"
            exit 1
          fi
          # Блок собираем на раннере, шлём по шифрованному scp, на боксе дописываем
          # под root и чистим временный файл. Значения с пробелами — в кавычках
          # (systemd EnvironmentFile снимает их, а `source` не ломается — грабля trener).
          umask 077
          cat > form.env <<EOF
          SMARTCAPTCHA_SERVER_KEY=$SMARTCAPTCHA_SERVER_KEY
          EOF
          if [ -n "$SMTP_PASS" ]; then
            cat >> form.env <<EOF
          SMTP_HOST=smtp.yandex.ru
          SMTP_PORT=465
          SMTP_SECURE=true
          SMTP_USER=valstan@valstan.ru
          SMTP_PASS=$SMTP_PASS
          SMTP_FROM_ADDRESS=valstan@valstan.ru
          SMTP_FROM_NAME="Малмыжский ремзавод — сайт"
          EOF
            echo "SMTP_PASS задан — пишу и SMTP-блок (7 строк)"
          else
            echo "⚠️ secrets.SMTP_PASS не задан — SMTP-блок пропускаю, письма-дубли не включатся"
          fi
          scp -q form.env rmz:/tmp/form.env
          rm -f form.env
          ssh rmz 'sudo bash -s' <<'REMOTE'
          set -e
          ENV=/etc/rmz/rmz.env
          test -f "$ENV" || { echo "::error::$ENV нет — сначала setup-prod-stage2.yml"; exit 1; }
          # идемпотентность: убрать прежние строки блока, дописать свежие
          sed -i '/^SMARTCAPTCHA_/d; /^SMTP_/d' "$ENV"
          cat /tmp/form.env >> "$ENV"
          rm -f /tmp/form.env
          chown root:valstan "$ENV"
          chmod 640 "$ENV"
          systemctl restart rmz
          echo "form-secret lines in env now: $(grep -cE '^(SMARTCAPTCHA_|SMTP_)' "$ENV")"
          REMOTE

      - name: Verify (service up, site 200)
        run: |
          set -e
          sleep 8
          ssh rmz 'sudo bash -s' <<'REMOTE'
          set -e
          ENV=/etc/rmz/rmz.env
          grep -q '^SMARTCAPTCHA_SERVER_KEY=' "$ENV" || { echo "::error::SMARTCAPTCHA_SERVER_KEY не записан"; exit 1; }
          echo "SMTP lines: $(grep -cE '^SMTP_' "$ENV" || true)"
          systemctl is-active rmz
          # Проверка изнутри бокса (как смоук деплоя): внешний curl с раннера
          # GitHub до хостера флейкает и давал ложный красный (run 29641380411).
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -H "Host: xn--g1ajl.xn--80adkdyec4j.xn--p1ai" -H "X-Forwarded-Proto: https" http://127.0.0.1/)
          echo "homepage HTTP: $code"
          [ "$code" = "200" ] || { echo "::error::Главная вернула $code после рестарта"; exit 1; }
          REMOTE
          echo "✅ Секреты форм записаны, сервис активен, сайт отвечает 200."
