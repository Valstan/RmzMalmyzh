# Сканер секретов в PR-гейт — мандат brain 2026-08-17 (решение владельца D-030).
#
# Зачем именно теперь: репозиторий стал публичным, а у публичного репо утёкший
# секрет скомпрометирован С СЕКУНДЫ ПУША — форки, зеркала и кэши уже не отозвать,
# и «удалить коммит» его не лечит (лечит только ротация). До 17.08 нас защищала
# приватность; её больше нет.
#
# Три свойства обязательны, и каждое здесь выбрано осознанно:
#   fetch-depth: 0    — иначе сканируется один коммит вместо истории, и гейт
#                       зелен ровно в том сценарии, ради которого ставится;
#   --redact          — иначе найденный секрет печатается в лог CI и утекает
#                       второй раз, уже через артефакты Actions;
#   --exit-code 1     — находка обязана валить job, а не просто светиться.
#
# Бинарь с явными флагами, а не gitleaks-action: так все три свойства видны
# в самом файле и не зависят от умолчаний обёртки (тот же приём у Казанской).
name: secret-scan

on: [pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Полная история: gitleaks ловит и секреты, удалённые следующим
          # коммитом, — а именно так их обычно и «убирают».
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -eo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1
