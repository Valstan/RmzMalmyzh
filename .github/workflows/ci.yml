# CI-гейт PR/main: lint + typecheck + build (стадия 2: Payload, нужна эфемерная БД).
# Деплой — отдельным deploy-prod.yml (сборка строго в CI, G20).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rmz_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: actions/cache@v4
        with:
          path: public/images/wp
          key: wp-images-${{ hashFiles('content/images-manifest.json') }}
      - run: pnpm fetch-images
      # push:true создаёт схему только в dev-рантайме; prerender при build лезет
      # в таблицы (llms.txt/sitemap) — схему в эфемерной БД создаём явно.
      - name: Push schema to ephemeral DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmz_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
        run: pnpm payload run src/seed/pushSchema.ts
      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmz_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
        run: pnpm build

      # Регрессия на «час пустой главной после каждого деплоя»: deploy-prod собирает
      # с пустой БД (прод не тянет build — G20), поэтому контентные страницы НЕ должны
      # запекаться на сборке. Воспроизводим прод буквально: собрали на пустой базе,
      # только теперь наполнили её, подняли сервер — и требуем контент в ответе.
      # С `revalidate` вместо `dynamic = "force-dynamic"` этот шаг обязан краснеть.
      - name: Контентные страницы рендерятся из БД, а не из пререндера
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmz_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
        run: |
          set -eo pipefail
          pnpm payload run src/seed/seedFromStage1.ts
          pnpm start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done

          curl -sL http://127.0.0.1:3000/ -o home.html
          grep -q 'prose-rmz' home.html || {
            echo "::error::на главной нет контентного блока — отдаётся пререндер с пустой БД"
            tail -30 server.log; exit 1; }

          curl -sL http://127.0.0.1:3000/voprosy-i-otvety/ -o faq.html
          grep -q '"@type":"Question"' faq.html || { echo "::error::в FAQ нет вопросов из БД"; exit 1; }

          curl -sL http://127.0.0.1:3000/llms.txt -o llms.out
          grep -q '/uslugi/' llms.out || { echo "::error::в llms.txt нет услуг из БД"; exit 1; }

          curl -sL http://127.0.0.1:3000/sitemap.xml -o sitemap.out
          N=$(grep -c '<loc>' sitemap.out || true)
          echo "адресов в sitemap: $N"
          [ "$N" -ge 100 ] || { echo "::error::в sitemap $N адресов — собран с пустой БД"; exit 1; }

          # Регрессия на «контентные страницы уходят в мессенджеры без картинки
          # и заголовка». В generateMetadata маршрута [...slug] стоял
          # `openGraph: page.ogImage ? {...} : undefined` — а ключ со значением
          # undefined в Next НЕ означает «оставить родительские теги»: он их
          # обнуляет. Соседние маршруты (/novosti/, /voprosy-i-otvety/) ключ не
          # указывают вовсе и теги наследуют — отсюда и разница, которая
          # маскировала дефект. Замерено на проде 2026-08-22: у `/` пять og-тегов,
          # у `/kontakty/` и `/uslugi/` — ноль.
          curl -sL http://127.0.0.1:3000/kontakty/ -o og.html
          for T in og:title og:description og:image og:type; do
            grep -q "property=\"$T\"" og.html || {
              echo "::error::на контентной странице нет $T — openGraph обнулён в generateMetadata"
              grep -o 'property="og:[a-z:]*"' og.html | sort -u; exit 1; }
          done
          echo "✅ контентная страница из [...slug] несёт og-теги"

          echo "✅ главная, FAQ, llms.txt и sitemap берут контент из БД в рантайме"

          # ── Формы: единственный конверсионный путь завода ────────────────────
          # До сих пор он не был покрыт ничем: и этот шаг, и смоук #011 состояли
          # из одних GET, поэтому 500 на отправке заявки уехал бы на прод зелёным,
          # а завод узнал бы об этом по телефонному звонку клиента. Сервер уже
          # поднят и БД наполнена — добавляем только curl и psql.
          # Капча в CI не мешает: SMARTCAPTCHA_SERVER_KEY не задан, и обе проверки
          # в роутах в этом случае пропускают запрос.
          zq() { docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_build -tAc "$1" | tr -d ' \r'; }

          echo "== заявка: успешный POST =="
          # Слэш обязателен, а -L здесь ЗАПРЕЩЁН: при trailingSlash: true запрос
          # без слэша отдаёт 308, и curl -L повторил бы его уже без тела — то есть
          # проверка зеленела бы на сломанном пути. Клиенты шлют со слэшем.
          CODE=$(curl -s -o post.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"name":"CI смоук","contact":"+70000000000","message":"проверка гейта"}' \
            http://127.0.0.1:3000/api/zayavka/)
          echo "POST /api/zayavka/ → $CODE $(cat post.json)"
          [ "$CODE" = "200" ] || { echo "::error::заявка не принята, код $CODE (308 = тело потеряно на редиректе trailingSlash)"; tail -40 server.log; exit 1; }
          grep -q '"ok":true' post.json || { echo "::error::в ответе на заявку нет ok:true"; exit 1; }
          Z=$(zq "SELECT count(*) FROM zayavki")
          [ "$Z" = "1" ] || { echo "::error::в zayavki $Z записей, ожидалась 1 — заявка не сохранилась"; tail -40 server.log; exit 1; }

          echo "== заявка: honeypot глушит бота, но не подаёт виду =="
          curl -s -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"name":"бот","contact":"бот","website":"http://spam.example"}' \
            http://127.0.0.1:3000/api/zayavka/
          Z=$(zq "SELECT count(*) FROM zayavki")
          [ "$Z" = "1" ] || { echo "::error::honeypot пропустил запись бота: в zayavki $Z"; exit 1; }

          echo "== заявка: без обязательного поля — 400 =="
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"contact":"+70000000000"}' http://127.0.0.1:3000/api/zayavka/)
          [ "$CODE" = "400" ] || { echo "::error::заявка без имени принята с кодом $CODE"; exit 1; }

          echo "== заявка: тело сверх потолка — 413 ДО разбора JSON =="
          # nginx пропускает 25 МБ (лимит стоит ради загрузок в админку и накрывает
          # /api/), а процесс делит MemoryMax=512M со всем сайтом. Капча проверяется
          # после разбора тела и от этого не защищает.
          python3 -c "import json;print(json.dumps({'name':'x','contact':'y','message':'A'*200000}))" > big.json
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data-binary @big.json http://127.0.0.1:3000/api/zayavka/)
          [ "$CODE" = "413" ] || { echo "::error::тело на 200 КБ принято с кодом $CODE — потолок не работает"; exit 1; }

          echo "== анкета соискателя: второй роут, своя ветка кода =="
          CODE=$(curl -s -o rez.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"vacancy":"Токарь","name":"CI Соискатель","phone":"+70000000001","answers":[["Город:","Малмыж"]]}' \
            http://127.0.0.1:3000/api/rezyume/)
          [ "$CODE" = "200" ] || { echo "::error::анкета не принята, код $CODE"; tail -40 server.log; exit 1; }
          S=$(zq "SELECT count(*) FROM zayavki WHERE subject LIKE 'Отклик на вакансию%'")
          [ "$S" = "1" ] || { echo "::error::анкета не создала запись с subject «Отклик на вакансию…»"; exit 1; }

          echo "== анкета: регрессия на открытую рассылку =="
          # Адрес копии берётся из тела запроса, а nodemailer читает «a@b.ru, x@y.ru»
          # как СПИСОК получателей: без проверки ящик завода рассылал бы письма с
          # его же брендом куда угодно. Флаг copy в ответе делает отказ наблюдаемым.
          curl -s -o relay.json -X POST -H 'Content-Type: application/json' \
            -d '{"vacancy":"Токарь","name":"CI Релей","phone":"+70000000002","email":"a@b.ru, victim@example.com","answers":[]}' \
            http://127.0.0.1:3000/api/rezyume/
          grep -q '"copy":false' relay.json || { echo "::error::копия ушла бы на список адресов: $(cat relay.json)"; exit 1; }
          curl -s -o copy.json -X POST -H 'Content-Type: application/json' \
            -d '{"vacancy":"Токарь","name":"CI Копия","phone":"+70000000003","email":"one@example.com","answers":[]}' \
            http://127.0.0.1:3000/api/rezyume/
          grep -q '"copy":true' copy.json || { echo "::error::валидный одиночный адрес не прошёл проверку: $(cat copy.json)"; exit 1; }

          echo "✅ формы: заявка и анкета пишутся в БД, honeypot глушит, 400 и 413 отдаются, рассылка на список адресов отвергнута"

  # Импорт харвест-картинок в коллекцию media (аудит §4.2) проверяется здесь и
  # только здесь: на dev-машине PC40 нет ни Postgres, ни Docker, а вторая живая
  # база — прод. Поэтому гейт скрипта, который будет править контент прода, —
  # полный прогон на эфемерной БД: импорт → перевод ссылок → идемпотентность →
  # живая выдача картинки через next start.
  media:
    name: media-import
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rmz_media
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmz_media
      PAYLOAD_SECRET: ci-media-only-secret-not-used-at-runtime
      # Вне public/, чтобы файлы медиа не подменяли статику в сборке.
      MEDIA_DIR: ${{ github.workspace }}/.media-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: public/images/wp
          key: wp-images-${{ hashFiles('content/images-manifest.json') }}
      - run: pnpm fetch-images
      - name: Seed schema + контент стадии 1
        run: |
          mkdir -p "$MEDIA_DIR"
          pnpm payload run src/seed/pushSchema.ts
          pnpm payload run src/seed/seedFromStage1.ts

      - name: Dry-run не должен ничего писать
        run: |
          # pipefail обязателен: без него tee вернул бы 0 при упавшем скрипте (G159).
          set -eo pipefail
          pnpm payload run src/seed/mediaFromContent.ts | tee dry.log
          grep -q 'dry-run' dry.log || { echo "::error::dry-run не заявлен в выводе"; exit 1; }
          N=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_media -tAc "SELECT count(*) FROM media" | tr -d ' \r')
          [ "$N" = "0" ] || { echo "::error::dry-run создал $N записей в media — должен был 0"; exit 1; }
          L=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_media -tAc "SELECT count(*) FROM pages WHERE html LIKE '%/images/wp/%'" | tr -d ' \r')
          [ "$L" != "0" ] || { echo "::error::dry-run уже переписал контент"; exit 1; }
          echo "✅ dry-run чист: media=0, страниц с legacy-ссылками=$L"

      # Фазы прогоняются раздельно — ровно так, как пойдёт на проде: сначала
      # записи и файлы, затем (после доставки файлов на бокс) ссылки. Гоняем то,
      # что поедет, а не упрощённый вариант.
      - name: Фаза media — записи и файлы
        run: |
          set -eo pipefail
          PHASE=media APPLY=1 pnpm payload run src/seed/mediaFromContent.ts | tee media.log

      - name: Фаза media не должна трогать ссылки
        run: |
          set -e
          q() { docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_media -tAc "$1" | tr -d ' \r'; }
          STILL=$(q "SELECT count(*) FROM pages WHERE html LIKE '%/images/wp/%'")
          [ "$STILL" != "0" ] || { echo "::error::фаза media переписала контент — это работа фазы links"; exit 1; }
          # Имя задаётся явно, а не берётся из basename: иначе поиск по
          # детерминированному имени промахнётся и второй прогон наплодит дубли.
          BAD=$(q "SELECT count(*) FROM media WHERE filename NOT LIKE 'wp-%'")
          [ "$BAD" = "0" ] || { echo "::error::$BAD записей media с именем не по схеме wp-ГОД-МЕСЯЦ-…"; exit 1; }
          # Две коллизии базовых имён между месяцами обязаны разъехаться по префиксу.
          C=$(q "SELECT count(*) FROM media WHERE filename LIKE '%dd-6chn18-22.jpg' OR filename LIKE '%sudovoj_dvigatel_nvd-26.jpg'")
          [ "$C" = "4" ] || { echo "::error::коллизии имён разъехались не полностью: найдено $C записей, ожидалось 4"; exit 1; }
          echo "✅ фаза media: ссылки не тронуты, имена по схеме, коллизии разведены"

      # Регрессия на прод-аварию 28.07 (прогон 30351998453): фаза media записала
      # 180 документов, доставка файлов упала (на боксе нет rsync), staging умер
      # вместе с job. Повторный прогон обязан восстановить файл в ТУ ЖЕ запись —
      # иначе фаза links увела бы ссылки на пустоту.
      - name: Половинчатое состояние — прогон обязан упасть, reset обязан вылечить
        run: |
          set -eo pipefail
          q() { docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_media -tAc "$1" | tr -d ' \r'; }
          # Жертву берём из БД, а не через `ls | head`: head закрывает пайп раньше,
          # ls получает write error и под pipefail роняет шаг.
          VICTIM=$(q "SELECT filename FROM media ORDER BY id LIMIT 1")
          echo "жертва: $VICTIM"
          rm -f "$MEDIA_DIR/$VICTIM"

          # 1. Запись есть, файла нет → падение с понятным диагнозом, а НЕ тихое
          #    продолжение: иначе фаза links увела бы ссылки на пустоту.
          set +e
          PHASE=media APPLY=1 pnpm payload run src/seed/mediaFromContent.ts > half.log 2>&1
          CODE=$?
          set -e
          tail -12 half.log
          [ "$CODE" != "0" ] || { echo "::error::прогон с записью без файла обязан падать, а вернул 0"; exit 1; }
          grep -q 'записей без файла в MEDIA_DIR' half.log || { echo "::error::нет диагноза про записи без файла"; exit 1; }

          # 2. reset отказывается работать, если контент уже переведён (здесь ещё нет).
          PHASE=reset APPLY=1 pnpm payload run src/seed/mediaFromContent.ts | tee reset.log
          LEFT=$(q "SELECT count(*) FROM media WHERE filename LIKE 'wp-%'")
          [ "$LEFT" = "0" ] || { echo "::error::после reset осталось $LEFT импортных записей"; exit 1; }

          # 3. Чистый повтор возвращает полный импорт.
          PHASE=media APPLY=1 pnpm payload run src/seed/mediaFromContent.ts | tee remedia.log
          N=$(q "SELECT count(*) FROM media")
          D=$(find public/images/wp -type f | wc -l | tr -d ' ')
          [ "$N" = "$D" ] || { echo "::error::после повтора в media $N записей, ожидалось $D"; exit 1; }
          BAD=$(q "SELECT count(*) FROM media WHERE filename NOT LIKE 'wp-%'")
          [ "$BAD" = "0" ] || { echo "::error::повтор дал $BAD записей с именем не по схеме"; exit 1; }
          echo "✅ падение с диагнозом, reset вылечил, повтор дал полный импорт без дрейфа имён"

      - name: Фаза links — перевод ссылок
        run: |
          set -eo pipefail
          PHASE=links APPLY=1 pnpm payload run src/seed/mediaFromContent.ts | tee links.log

      - name: Проверки состояния БД и диска
        run: |
          set -e
          q() { docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_media -tAc "$1" | tr -d ' \r'; }
          MEDIA=$(q "SELECT count(*) FROM media")
          # Только по html: имя колонки для ogImage зависит от snake_case-политики
          # адаптера, а ogImage всё равно покрыт проверкой идемпотентности ниже —
          # скрипт сканирует и его, и второй прогон обязан сказать «нечего».
          LEGACY=$(q "SELECT count(*) FROM pages WHERE html LIKE '%/images/wp/%'")
          ONMEDIA=$(q "SELECT count(*) FROM pages WHERE html LIKE '%/media/%'")
          FILES=$(find "$MEDIA_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')
          DISK=$(find public/images/wp -type f | wc -l | tr -d ' ')
          echo "media=$MEDIA файлов_на_диске_харвеста=$DISK файлов_в_MEDIA_DIR=$FILES страниц_с_legacy=$LEGACY страниц_на_media=$ONMEDIA"
          [ "$MEDIA" = "$DISK" ] || { echo "::error::в media $MEDIA записей, а файлов харвеста $DISK — импорт неполный"; exit 1; }
          [ "$LEGACY" = "0" ] || { echo "::error::осталось $LEGACY страниц с ссылками на /images/wp/"; exit 1; }
          [ "$ONMEDIA" != "0" ] || { echo "::error::ни одна страница не ссылается на /media/"; exit 1; }
          [ "$FILES" -ge "$DISK" ] || { echo "::error::в MEDIA_DIR $FILES файлов, ожидалось не меньше $DISK"; exit 1; }
          echo "✅ импорт полный, legacy-ссылок не осталось"

      - name: Идемпотентность — второй прогон не должен найти работы
        run: |
          set -eo pipefail
          APPLY=1 pnpm payload run src/seed/mediaFromContent.ts | tee again.log
          grep -q 'переводить нечего' again.log || { echo "::error::второй прогон нашёл работу — скрипт не идемпотентен"; exit 1; }
          N=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_media -tAc "SELECT count(*) FROM media" | tr -d ' ')
          D=$(find public/images/wp -type f | wc -l | tr -d ' ')
          [ "$N" = "$D" ] || { echo "::error::второй прогон наплодил дублей: media=$N, ожидалось $D"; exit 1; }
          echo "✅ второй прогон — no-op, дублей нет"

      - name: Build + живая выдача картинки
        run: |
          set -e
          pnpm build
          pnpm start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done
          ID=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_media -tAc "SELECT id FROM media ORDER BY id LIMIT 1" | tr -d ' \r')
          NAME=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d rmz_media -tAc "SELECT filename FROM media ORDER BY id LIMIT 1" | tr -d ' \r')
          URL="http://127.0.0.1:3000/media/$ID/$NAME"
          echo "== первый хоп (важно: 308 означал бы редирект на каждой картинке из-за trailingSlash) =="
          curl -s -o /dev/null -w 'no-follow: %{http_code}\n' "$URL"
          CODE=$(curl -sL -o body.bin -w '%{http_code}' "$URL")
          TYPE=$(curl -sL -o /dev/null -w '%{content_type}' "$URL")
          SIZE=$(wc -c < body.bin | tr -d ' ')
          echo "follow: $CODE, type: $TYPE, bytes: $SIZE"
          [ "$CODE" = "200" ] || { echo "::error::картинка отдалась с кодом $CODE"; tail -40 server.log; exit 1; }
          case "$TYPE" in image/*) ;; *) echo "::error::Content-Type не image/*: $TYPE"; exit 1 ;; esac
          [ "$SIZE" -gt 1000 ] || { echo "::error::тело картинки $SIZE байт — подозрительно мало"; exit 1; }
          echo "== страница должна ссылаться на /media/ =="
          curl -sL http://127.0.0.1:3000/ -o home.html
