# CI: сборка статического экспорта. Деплой-job добавится после выдачи
# изолированного deploy-ключа (#001) владельцем — сборка строго в CI (G20).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fetch-images
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: site-static
          path: out/
          retention-days: 7
